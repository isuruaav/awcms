# Map this application's URL prefix to Laravel's public directory.
# Debian/Ubuntu: install in /etc/apache2/conf-available/ and enable with a2enconf.

# Keep existing links working during the URL change.
# Use 301 after the new URL has been verified in production.
RedirectMatch 302 "^/sch_of_slsc/public(?:/(.*))?$" "/sch_of_slsc/$1"

Alias "/sch_of_slsc" "/var/www/html/sch_of_slsc/public"

<Directory "/var/www/html/sch_of_slsc/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
