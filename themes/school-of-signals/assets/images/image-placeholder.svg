<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">School of Signals image placeholder</title>
  <desc id="desc">A dark blue and green placeholder displayed when a remote photograph is unavailable.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102c4b"/>
      <stop offset="1" stop-color="#08723b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#37d67a" stop-opacity=".3"/>
      <stop offset="1" stop-color="#37d67a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#background)"/>
  <rect width="1200" height="700" fill="url(#glow)"/>
  <g fill="none" stroke="#6ce29a" stroke-width="8" stroke-linecap="round" opacity=".75">
    <path d="M500 385h200M540 315h120M570 245h60"/>
    <circle cx="600" cy="420" r="120"/>
  </g>
  <text x="600" y="590" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">SCHOOL OF SIGNALS</text>
  <text x="600" y="638" fill="#9ee9bb" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">TECHNOLOGICAL SOUND</text>
</svg>
